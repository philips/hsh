name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

jobs:
  test:
    name: vet + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: vet
        run: go vet ./...

      - name: unit tests
        run: go test ./...

  release:
    name: release binaries (linux amd64 + arm64)
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # hsh is pure Go (modernc.org/sqlite, CGO_ENABLED=0), so both
      # targets cross-compile from the runner without a cross toolchain.
      - name: build linux/amd64
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w -X hsh/internal/version.Tag=${GITHUB_REF_NAME}" -o dist/hsh-linux-amd64 .

      - name: build linux/arm64 (aarch64)
        run: CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="-s -w -X hsh/internal/version.Tag=${GITHUB_REF_NAME}" -o dist/hsh-linux-arm64 .

      - name: checksums
        run: cd dist && sha256sum hsh-linux-amd64 hsh-linux-arm64 > SHA256SUMS

      - name: upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/hsh-linux-amd64
            dist/hsh-linux-arm64
            dist/SHA256SUMS

  # Build the pre-built harness workspace images (images/<name>/Containerfile)
  # and publish them multi-arch:
  #   ghcr.io/<owner>/hsh-<name>:latest
  # Each image carries an org.ifup.hsh label with the default hsh config
  # (provider secrets + network allowlist) for the harness it ships.
  harness-images:
    name: harness image (${{ matrix.name }})
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        name: [pi, vibe, claude-code, codex, muse-code]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
        with:
          platforms: amd64,arm64

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: build and push the harness image
        uses: docker/build-push-action@v6
        with:
          context: images/${{ matrix.name }}/
          file: images/${{ matrix.name }}/Containerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/hsh-${{ matrix.name }}:latest
            ghcr.io/${{ github.repository_owner }}/hsh-${{ matrix.name }}:${{ github.ref_name }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max
