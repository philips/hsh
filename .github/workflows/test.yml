name: test

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'Documentation/**'
      - 'internal-docs/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'Documentation/**'
      - 'internal-docs/**'
  workflow_dispatch:

env:
  GOEXPERIMENT: simd

jobs:
  unit:
    name: unit (build, vet, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: build
        run: go build ./...

      - name: vet
        run: go vet ./...

      - name: unit tests
        run: go test ./...

      - name: installer test (mock release server)
        run: ./test/install.sh

      - name: static build check
        run: CGO_ENABLED=0 go build -o hsh .

      - uses: actions/cache@v4
        with:
          path: internal/gvisor/.cache
          key: gvisor-payload-${{ hashFiles('internal/gvisor/payload.sh') }}

      - name: release build (./build.sh, embedded gVisor)
        run: ./build.sh -o hsh-release

      - name: vet with embedded gVisor
        run: go vet -tags gvisor_embed ./...

  # The functional test runs real sandboxes with rootless podman and
  # exercises the fixture image (built from test/fixtures/) plus live
  # api.mistral.ai egress, so it needs internet and a few minutes.
  functional:
    name: functional (podman sandbox, both runtimes)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: install rootless podman networking
        run: sudo apt-get update && sudo apt-get install -y passt uidmap

      - name: ensure subuid/subgid entries for the runner user
        run: |
          if ! grep -q "^${USER}:" /etc/subuid; then
            echo "${USER}:100000:65536" | sudo tee -a /etc/subuid
            echo "${USER}:100000:65536" | sudo tee -a /etc/subgid
          fi

      - name: allow unprivileged user namespaces for runsc
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: verify rootless podman
        run: podman info --format 'podman {{.Version.Version}} on {{.Host.Arch}}'

      - uses: actions/cache@v4
        with:
          path: internal/gvisor/.cache
          key: gvisor-payload-${{ hashFiles('internal/gvisor/payload.sh') }}

      - name: gVisor payload
        run: bash internal/gvisor/payload.sh

      - name: functional test (container and gvisor runtimes)
        run: ./test/functional.sh

  gvisor:
    name: gvisor (podman + runsc)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: install rootless podman networking
        run: sudo apt-get update && sudo apt-get install -y passt uidmap

      - name: ensure subuid/subgid entries for the runner user
        run: |
          if ! grep -q "^${USER}:" /etc/subuid; then
            echo "${USER}:100000:65536" | sudo tee -a /etc/subuid
            echo "${USER}:100000:65536" | sudo tee -a /etc/subgid
          fi

      - name: allow unprivileged user namespaces for runsc
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: verify rootless podman
        run: podman info --format 'podman {{.Version.Version}} on {{.Host.Arch}}'

      - uses: actions/cache@v4
        with:
          path: internal/gvisor/.cache
          key: gvisor-payload-${{ hashFiles('internal/gvisor/payload.sh') }}

      - name: gVisor payload
        run: bash internal/gvisor/payload.sh

      - name: gvisor test
        run: ./test/gvisor.sh
