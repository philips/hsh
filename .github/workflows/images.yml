name: images

# Keep the pre-built harness workspace images (images/<name>/Containerfile)
# building automatically outside of releases:
#   - PRs touching images/ get a fast amd64 build check (no push)
#   - pushes to main touching images/ rebuild and push :latest to ghcr.io
#   - a weekly schedule rebuilds :latest so the base image (fedora:latest)
#     and the agent installers stay current
# Tag releases additionally publish version-pinned tags in release.yml.

on:
  push:
    branches: [main]
    paths: ['images/**']
  pull_request:
    paths: ['images/**']
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  packages: write

jobs:
  check:
    name: build check (${{ matrix.name }})
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        name: [pi, vibe, claude-code, codex]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: build image
        uses: docker/build-push-action@v6
        with:
          context: images/${{ matrix.name }}/
          file: images/${{ matrix.name }}/Containerfile
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=${{ matrix.name }}

  publish:
    name: publish (ghcr.io, amd64 + arm64)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        name: [pi, vibe, claude-code, codex]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
        with:
          platforms: amd64,arm64

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: build and push image
        uses: docker/build-push-action@v6
        with:
          context: images/${{ matrix.name }}/
          file: images/${{ matrix.name }}/Containerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/hsh-${{ matrix.name }}:latest
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max
